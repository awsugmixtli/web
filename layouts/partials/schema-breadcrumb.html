<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Inicio",
      "item": "https://awsugmixtli.com/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ .Section | title | jsonify | safeJS }},
      "item": "{{ absURL .Section }}/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ .Title | jsonify | safeJS }},
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
