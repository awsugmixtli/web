{{ define "main" }}
  <article class="section">
    <div class="container container-narrow">
      {{ partial "breadcrumb.html" . }}
      <header class="page-header">
        <h1 class="page-title">{{ .Title }}</h1>
        {{ with .Params.description }}<p class="page-description">{{ . }}</p>{{ end }}
      </header>
      <div class="prose">
        {{ .Content }}
      </div>
    </div>
  </article>
{{ end }}
