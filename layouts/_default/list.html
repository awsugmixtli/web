{{ define "main" }}
  <section class="section">
    <div class="container">
      {{ partial "breadcrumb.html" . }}
      <header class="section-header">
        <h1 class="section-title">{{ .Title }}</h1>
        {{ with .Params.description }}<p class="section-subtitle">{{ . }}</p>{{ end }}
      </header>
      <div class="prose">
        {{ .Content }}
      </div>
      <ul class="page-list">
        {{ range .Pages }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </div>
  </section>
{{ end }}
