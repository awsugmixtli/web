<!DOCTYPE html>
<html lang="es-MX">
{{ partial "head.html" . }}
<body>

  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  {{ partial "nav.html" . }}

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  {{ block "scripts" . }}
  {{- $js := resources.Get "js/main.js" | js.Build (dict "minify" true) | resources.Fingerprint "sha256" }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer crossorigin="anonymous"></script>
  {{ end }}

</body>
</html>
