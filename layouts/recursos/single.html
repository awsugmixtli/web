{{ define "main" }}
<article class="article-page">
  <div class="container">

    {{ partial "breadcrumb.html" . }}

    <header class="article-header">
      <p class="article-lastmod">Actualizado: {{ with .Params.lastmod }}{{ . }}{{ else }}{{ .Date | time.Format "2 de January de 2006" }}{{ end }}</p>
      <h1 class="article-title">{{ .Title }}</h1>
      {{ with .Params.tags }}
      <div class="article-tags">
        {{ range . }}<a href="{{ "/tags/" | relURL }}{{ . | urlize }}/" class="tag-chip">{{ . }}</a>{{ end }}
      </div>
      {{ end }}
    </header>

    <div class="article-body prose">
      {{ .Content }}
    </div>

  </div>
</article>
{{ end }}
